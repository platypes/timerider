name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 22 is the lowest supported version (engines), 24 is the main one.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Check
        run: npm run check
      - name: Test
        # Same as `npm test`, plus coverage. Flags must come before the glob.
        run: >-
          node --test
          --experimental-test-coverage
          --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=lcov --test-reporter-destination=lcov.info
          "**/*.test.ts"
      - name: Upload coverage
        if: matrix.node == 24
        # No CODECOV_TOKEN yet, so a failed upload must not fail CI.
        continue-on-error: true
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./lcov.info
          fail_ci_if_error: false
      - name: Build
        run: npm run build
